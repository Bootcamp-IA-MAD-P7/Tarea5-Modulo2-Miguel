<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
 <title id="title">Validación de agrupamientos</title><desc id="desc">Infografía sobre el método del codo, la silueta y el criterio de dominio.</desc>
 <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c0d0b"/><stop offset=".58" stop-color="#211805"/><stop offset="1" stop-color="#493208"/></linearGradient><radialGradient id="g" cx="74%" cy="47%" r="62%"><stop stop-color="#e6a72e" stop-opacity=".29"/><stop offset="1" stop-color="#e6a72e" stop-opacity="0"/></radialGradient><filter id="s"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000" flood-opacity=".43"/></filter><style>text{font-family:Arial,Helvetica,sans-serif}.over{font-size:18px;font-weight:700;letter-spacing:4px}.h{font-size:31px;font-weight:800}.p{font-size:20px}.n{font-size:21px;font-weight:800}.small{font-size:17px;font-weight:700;letter-spacing:2px}</style></defs>
 <rect width="1600" height="900" fill="url(#bg)"/><rect width="1600" height="900" fill="url(#g)"/><text x="800" y="77" text-anchor="middle" class="over" fill="#f8c65a">EVALUACIÓN DEL AGRUPAMIENTO · DECIDIR CON EVIDENCIA</text><text x="800" y="124" text-anchor="middle" class="h" fill="#fff">VALIDAR ANTES DE INTERPRETAR</text>
 <g stroke="#d1a347" stroke-width="3" fill="none"><path d="M665 418H534L487 391"/><path d="M935 418H1066L1113 391"/></g><g fill="#f8c65a"><circle cx="665" cy="418" r="7"/><circle cx="935" cy="418" r="7"/></g>
 <g filter="url(#s)"><circle cx="800" cy="450" r="150" fill="#15140f" stroke="#f8c65a" stroke-width="6"/><circle cx="800" cy="450" r="124" fill="none" stroke="#d1a347" stroke-width="2" stroke-dasharray="6 10"/></g><text x="800" y="425" text-anchor="middle" class="small" fill="#f8c65a">SELECCIÓN</text><text x="800" y="462" text-anchor="middle" class="h" fill="#fff">EQUILIBRADA</text><text x="800" y="496" text-anchor="middle" class="p" fill="#fff">métrica + estabilidad</text><text x="800" y="525" text-anchor="middle" class="p" fill="#fff">+ contexto</text>
 <g transform="translate(94 232)" filter="url(#s)"><rect width="410" height="375" rx="32" fill="#f7f1e5"/><rect width="10" height="375" rx="5" fill="#f8c65a"/><circle cx="62" cy="-2" r="34" fill="#f8c65a"/><text x="62" y="7" text-anchor="middle" class="n" fill="#102c56">01</text><text x="50" y="78" class="h" fill="#102c56">MÉTODO DEL CODO</text><text x="50" y="113" class="p" fill="#342705">Busca la ganancia marginal</text><text x="50" y="140" class="p" fill="#342705">al aumentar el número K.</text><path d="M74 302V187M74 302H340" stroke="#102c56" stroke-width="3"/><path d="M93 205L154 225 209 247 252 262 311 270" fill="none" stroke="#d89d20" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="209" cy="247" r="10" fill="#f8c65a" stroke="#102c56" stroke-width="3"/><text x="224" y="240" class="small" fill="#102c56">K CANDIDATO</text><text x="206" y="340" text-anchor="middle" class="small" fill="#102c56">INERCIA · MEJORA DECRECIENTE</text></g>
 <g transform="translate(1096 232)" filter="url(#s)"><rect width="410" height="375" rx="32" fill="#f7f1e5"/><rect width="10" height="375" rx="5" fill="#f8c65a"/><circle cx="62" cy="-2" r="34" fill="#f8c65a"/><text x="62" y="7" text-anchor="middle" class="n" fill="#102c56">02</text><text x="50" y="78" class="h" fill="#102c56">SILUETA</text><text x="50" y="113" class="p" fill="#342705">Mide cohesión interna</text><text x="50" y="140" class="p" fill="#342705">frente a separación externa.</text><circle cx="124" cy="238" r="29" fill="#f8c65a"/><circle cx="124" cy="238" r="8" fill="#102c56"/><circle cx="232" cy="238" r="29" fill="#ead7a5"/><circle cx="232" cy="238" r="8" fill="#102c56"/><path d="M158 238H198" stroke="#102c56" stroke-width="3" stroke-dasharray="5 5"/><rect x="79" y="292" width="258" height="44" rx="22" fill="#102c56"/><text x="208" y="320" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" letter-spacing="1.3" fill="#fff">−1 ≤ s(i) ≤ 1 · MAYOR = MEJOR</text></g>
 <g transform="translate(330 700)"><rect width="940" height="70" rx="35" fill="#f7f1e5" fill-opacity=".98"/><circle cx="49" cy="35" r="11" fill="#f8c65a"/><text x="77" y="42" class="p" fill="#102c56">La solución final debe ser estable, interpretable y útil para el dominio.</text></g>
</svg>
