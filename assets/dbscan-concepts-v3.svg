<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
 <title id="title">Conceptos fundamentales de DBSCAN</title><desc id="desc">Infografía sobre puntos núcleo, frontera y ruido en DBSCAN.</desc>
 <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c0d0b"/><stop offset=".58" stop-color="#211805"/><stop offset="1" stop-color="#493208"/></linearGradient><radialGradient id="g" cx="74%" cy="47%" r="62%"><stop stop-color="#e6a72e" stop-opacity=".29"/><stop offset="1" stop-color="#e6a72e" stop-opacity="0"/></radialGradient><filter id="s"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000" flood-opacity=".43"/></filter><style>text{font-family:Arial,Helvetica,sans-serif}.over{font-size:18px;font-weight:700;letter-spacing:4px}.h{font-size:31px;font-weight:800}.p{font-size:20px}.n{font-size:21px;font-weight:800}.small{font-size:17px;font-weight:700;letter-spacing:2px}</style></defs>
 <rect width="1600" height="900" fill="url(#bg)"/><rect width="1600" height="900" fill="url(#g)"/><text x="800" y="77" text-anchor="middle" class="over" fill="#f8c65a">CLUSTERING BASADO EN DENSIDAD · DBSCAN</text><text x="800" y="124" text-anchor="middle" class="h" fill="#fff">CUÁNDO UNA ZONA FORMA UN CLUSTER</text>
 <g transform="translate(76 195)" filter="url(#s)"><rect width="430" height="500" rx="32" fill="#f7f1e5"/><rect width="10" height="500" rx="5" fill="#f8c65a"/><circle cx="62" cy="-3" r="34" fill="#f8c65a"/><text x="62" y="7" text-anchor="middle" class="n" fill="#102c56">01</text><text x="54" y="78" class="h" fill="#102c56">PUNTO NÚCLEO</text><text x="54" y="113" class="p" fill="#342705">Tiene al menos MinPts</text><text x="54" y="141" class="p" fill="#342705">vecinos en un radio ε.</text><circle cx="218" cy="316" r="112" fill="none" stroke="#d89d20" stroke-width="4" stroke-dasharray="8 8"/><g fill="#102c56"><circle cx="218" cy="316" r="14"/><circle cx="166" cy="273" r="11"/><circle cx="199" cy="252" r="11"/><circle cx="255" cy="269" r="11"/><circle cx="274" cy="315" r="11"/><circle cx="245" cy="357" r="11"/><circle cx="191" cy="365" r="11"/><circle cx="159" cy="329" r="11"/></g><text x="218" y="465" text-anchor="middle" class="small" fill="#102c56">ZONA SUFICIENTEMENTE DENSA</text></g>
 <g transform="translate(585 195)" filter="url(#s)"><rect width="430" height="500" rx="32" fill="#f7f1e5"/><rect width="10" height="500" rx="5" fill="#f8c65a"/><circle cx="62" cy="-3" r="34" fill="#f8c65a"/><text x="62" y="7" text-anchor="middle" class="n" fill="#102c56">02</text><text x="54" y="78" class="h" fill="#102c56">PUNTO FRONTERA</text><text x="54" y="113" class="p" fill="#342705">Está cerca de un núcleo,</text><text x="54" y="141" class="p" fill="#342705">pero no expande el grupo.</text><path d="M97 356c4-145 164-182 236-83 51 71-7 181-109 170-76-8-129-36-127-87z" fill="#f8c65a" fill-opacity=".18" stroke="#d89d20" stroke-width="4" stroke-dasharray="8 8"/><g fill="#102c56"><circle cx="196" cy="298" r="12"/><circle cx="230" cy="278" r="12"/><circle cx="256" cy="311" r="12"/><circle cx="220" cy="341" r="12"/><circle cx="184" cy="348" r="12"/></g><circle cx="329" cy="383" r="13" fill="#f8c65a" stroke="#102c56" stroke-width="4"/><path d="M271 332L318 373" stroke="#102c56" stroke-width="3" stroke-dasharray="5 5"/><text x="218" y="465" text-anchor="middle" class="small" fill="#102c56">PERTENECE, PERO NO CONECTA</text></g>
 <g transform="translate(1094 195)" filter="url(#s)"><rect width="430" height="500" rx="32" fill="#f7f1e5"/><rect width="10" height="500" rx="5" fill="#f8c65a"/><circle cx="62" cy="-3" r="34" fill="#f8c65a"/><text x="62" y="7" text-anchor="middle" class="n" fill="#102c56">03</text><text x="54" y="78" class="h" fill="#102c56">RUIDO</text><text x="54" y="113" class="p" fill="#342705">No está conectado a una</text><text x="54" y="141" class="p" fill="#342705">región suficientemente densa.</text><g fill="#d89d20"><circle cx="131" cy="260" r="14"/><circle cx="304" cy="239" r="14"/><circle cx="348" cy="386" r="14"/><circle cx="109" cy="410" r="14"/></g><g fill="#102c56" opacity=".45"><circle cx="214" cy="302" r="10"/><circle cx="245" cy="330" r="10"/><circle cx="202" cy="354" r="10"/></g><text x="218" y="465" text-anchor="middle" class="small" fill="#102c56">ETIQUETA −1 EN SCIKIT-LEARN</text></g>
 <text x="800" y="786" text-anchor="middle" class="small" fill="#f8c65a">ε DEFINE EL VECINDARIO · MinPts DEFINE LA DENSIDAD MÍNIMA</text><text x="800" y="824" text-anchor="middle" class="p" fill="#fff">No se fija K: el número de grupos emerge de las regiones densas conectadas.</text>
</svg>
