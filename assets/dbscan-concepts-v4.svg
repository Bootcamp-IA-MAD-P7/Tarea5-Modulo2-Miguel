<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
 <title id="title">Conceptos de DBSCAN</title><desc id="desc">Infografía sobre puntos núcleo, frontera y ruido.</desc><defs><linearGradient id="shade" x2="1" y2="1"><stop stop-color="#06162d" stop-opacity=".78"/><stop offset="1" stop-color="#102c56" stop-opacity=".55"/></linearGradient><style>text{font-family:Arial,Helvetica,sans-serif}.over{font-size:17px;font-weight:700;letter-spacing:3px}.h{font-size:27px;font-weight:800}.p{font-size:18px}.tag{font-size:14px;font-weight:700;letter-spacing:1.2px}</style></defs>
 <image href="./dbscan-concepts-v2.png" width="1600" height="900" preserveAspectRatio="xMidYMid slice" opacity=".45"/><rect width="1600" height="900" fill="url(#shade)"/><text x="800" y="72" text-anchor="middle" class="over" fill="#7dd3fc">CLUSTERING BASADO EN DENSIDAD · DBSCAN</text><text x="800" y="116" text-anchor="middle" class="h" fill="#fff">CUÁNDO UNA ZONA FORMA UN CLUSTER</text>
 <g fill="#06162d" fill-opacity=".88" stroke="#38bdf8" stroke-width="2"><rect x="95" y="620" width="390" height="130" rx="18"/><rect x="605" y="620" width="390" height="130" rx="18"/><rect x="1115" y="620" width="390" height="130" rx="18"/></g><g fill="#fff"><text x="125" y="665" class="h">PUNTO NÚCLEO</text><text x="125" y="696" class="p">≥ MinPts vecinos dentro de ε.</text><text x="125" y="724" class="tag" fill="#7dd3fc">PUEDE EXPANDIR EL CLUSTER</text><text x="635" y="665" class="h">PUNTO FRONTERA</text><text x="635" y="696" class="p">Cerca de un núcleo; no lo expande.</text><text x="635" y="724" class="tag" fill="#7dd3fc">SE ASIGNA AL GRUPO</text><text x="1145" y="665" class="h">RUIDO</text><text x="1145" y="696" class="p">Sin conexión densa con un grupo.</text><text x="1145" y="724" class="tag" fill="#7dd3fc">ETIQUETA −1</text></g>
 <rect x="487" y="172" width="626" height="78" rx="39" fill="#06162d" fill-opacity=".88" stroke="#38bdf8" stroke-width="2"/><text x="800" y="221" text-anchor="middle" class="p" fill="#fff">ε define el vecindario · MinPts define la densidad mínima</text>
</svg>
