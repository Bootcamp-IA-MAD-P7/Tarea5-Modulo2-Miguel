<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
<title id="title">Validación de clustering</title><desc id="desc">Esquema sobre método del codo y coeficiente de silueta.</desc>
<defs><filter id="s"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#17335b" flood-opacity=".13"/></filter><style>text{font-family:Arial,Helvetica,sans-serif}.h{font-size:42px;font-weight:800;fill:#11243d}.k{font-size:20px;font-weight:700;letter-spacing:2px}.t{font-size:29px;font-weight:800;fill:#11243d}.p{font-size:24px;fill:#425a78}.w{font-size:25px;font-weight:800;fill:#fff}</style></defs>
<rect width="1400" height="760" fill="#fff"/><text x="700" y="76" text-anchor="middle" class="h">Validar antes de interpretar</text><text x="700" y="112" text-anchor="middle" class="k" fill="#53739c">PARÁMETROS · CALIDAD INTERNA · ESTABILIDAD · CONTEXTO</text>
<g filter="url(#s)"><rect x="64" y="214" width="445" height="330" rx="34" fill="#fff"/><circle cx="700" cy="375" r="142" fill="#fff" stroke="#d8e3f0" stroke-width="15"/><rect x="891" y="214" width="445" height="330" rx="34" fill="#fff"/></g>
<g fill="none" stroke-width="4"><path d="M509 375h49" stroke="#f5bd4d"/><path d="M842 375h49" stroke="#14b8a6"/></g><text x="700" y="359" text-anchor="middle" class="t">Selección</text><text x="700" y="395" text-anchor="middle" class="p">Combinar evidencia</text><text x="700" y="427" text-anchor="middle" class="p">sin una única métrica</text>
<circle cx="160" cy="214" r="42" fill="#f5bd4d"/><text x="160" y="214" text-anchor="middle" dominant-baseline="middle" class="w">1</text><text x="108" y="299" class="t">Método del codo</text><text x="108" y="338" class="p">Ganancia marginal al</text><text x="108" y="370" class="p">añadir clusters</text><g transform="translate(124 422)"><path d="M0 75H335M0 0V75" stroke="#9eb3cd" stroke-width="3"/><path d="M18 12C92 35 145 59 202 66S280 72 324 73" fill="none" stroke="#2563eb" stroke-width="7" stroke-linecap="round"/><circle cx="202" cy="66" r="10" fill="#f5bd4d"/><text x="222" y="55" class="p">K candidato</text></g>
<circle cx="987" cy="214" r="42" fill="#14b8a6"/><text x="987" y="214" text-anchor="middle" dominant-baseline="middle" class="w">2</text><text x="935" y="299" class="t">Coeficiente de silueta</text><text x="935" y="338" class="p">Cohesión frente a</text><text x="935" y="370" class="p">separación</text><g transform="translate(949 423)"><circle cx="48" cy="42" r="34" fill="#dbeafe"/><circle cx="48" cy="42" r="9" fill="#2563eb"/><circle cx="160" cy="42" r="34" fill="#ccfbf1"/><circle cx="160" cy="42" r="9" fill="#14b8a6"/><path d="M82 42h44" stroke="#9eb3cd" stroke-width="4" stroke-dasharray="7 8"/><rect x="226" y="5" width="170" height="74" rx="21" fill="#142b4b"/><text x="311" y="34" text-anchor="middle" class="w">−1 ≤ s(i) ≤ 1</text><text x="311" y="60" text-anchor="middle" font-family="Arial" font-size="17" fill="#dce8fa">Mayor es mejor</text></g>
<rect x="210" y="650" width="980" height="54" rx="27" fill="#f2f6fb"/><circle cx="250" cy="677" r="10" fill="#f36f45"/><text x="280" y="685" class="p">La solución final debe ser estable, interpretable y útil para el dominio.</text>
