<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 560" role="img" aria-labelledby="title desc">
  <title id="title">Validación de clustering</title><desc id="desc">Infografía sobre selección de parámetros mediante el método del codo y la silueta.</desc>
  <defs><filter id="s"><feDropShadow dx="0" dy="9" stdDeviation="9" flood-color="#17335b" flood-opacity=".14"/></filter><style>text{font-family:Arial,Helvetica,sans-serif}.h{font-size:28px;font-weight:800;fill:#132b4b}.k{font-size:14px;font-weight:700;letter-spacing:2px}.t{font-size:22px;font-weight:800;fill:#132b4b}.p{font-size:16px;fill:#5a6b81}.n{font-size:18px;font-weight:800;fill:#fff}</style></defs>
  <rect width="1600" height="560" rx="28" fill="#f7f9fd"/><text x="70" y="70" class="h">VALIDAR ANTES DE INTERPRETAR</text><text x="70" y="101" class="k" fill="#5d779c">PARÁMETROS · CALIDAD INTERNA · ESTABILIDAD · CONTEXTO</text>
  <g filter="url(#s)"><rect x="70" y="151" width="690" height="330" rx="32" fill="#fff"/><rect x="840" y="151" width="690" height="330" rx="32" fill="#fff"/></g>
  <text x="114" y="207" class="t">1. Método del codo</text><text x="114" y="237" class="p">Buscar la ganancia marginal de añadir clusters</text>
  <g transform="translate(132 274)"><path d="M0 144H560M0 0V144" stroke="#a6b8ce" stroke-width="3"/><path d="M35 21C120 54 180 89 250 108S390 132 540 137" fill="none" stroke="#2563eb" stroke-width="8" stroke-linecap="round"/><circle cx="250" cy="108" r="12" fill="#f59e0b"/><path d="M250 108L330 46" stroke="#f59e0b" stroke-width="3"/><text x="342" y="45" class="p">codo: K candidato</text><text x="-6" y="-12" class="k" fill="#5d779c">INERCIA</text><text x="500" y="178" class="k" fill="#5d779c">K</text></g>
  <text x="884" y="207" class="t">2. Coeficiente de silueta</text><text x="884" y="237" class="p">Contrastar cohesión interna y separación</text>
  <g transform="translate(916 275)"><circle cx="70" cy="72" r="42" fill="#dbeafe"/><circle cx="70" cy="72" r="10" fill="#2563eb"/><circle cx="238" cy="72" r="42" fill="#ccfbf1"/><circle cx="238" cy="72" r="10" fill="#059669"/><path d="M112 72h84" stroke="#94a3b8" stroke-width="4" stroke-dasharray="7 8"/><text x="70" y="144" text-anchor="middle" class="p">a(i) · propio grupo</text><text x="238" y="144" text-anchor="middle" class="p">b(i) · grupo vecino</text><rect x="354" y="25" width="210" height="92" rx="24" fill="#132b4b"/><text x="459" y="63" text-anchor="middle" class="n">−1 ≤ s(i) ≤ 1</text><text x="459" y="91" text-anchor="middle" class="p" fill="#d8e7fa">mayor es mejor</text></g>
  <g transform="translate(70 515)"><circle cx="8" cy="0" r="7" fill="#4f46e5"/><text x="25" y="6" class="p">Una métrica orienta; la decisión final exige estabilidad e interpretación del dominio.</text></g>
</svg>
