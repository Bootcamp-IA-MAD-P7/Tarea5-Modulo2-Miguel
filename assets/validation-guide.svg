<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" role="img" aria-labelledby="title desc">
  <title id="title">Evaluación de un agrupamiento</title><desc id="desc">Infografía centrada sobre método del codo y coeficiente de silueta.</desc>
  <defs><filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#18355f" flood-opacity=".13"/></filter><style>text{font-family:Arial,Helvetica,sans-serif}.h{font-size:38px;font-weight:800;fill:#14243c}.k{font-size:16px;font-weight:700;letter-spacing:2.5px}.t{font-size:27px;font-weight:800;fill:#14243c}.p{font-size:18px;fill:#52657f}.w{font-size:22px;font-weight:800;fill:#fff}.c{font-size:25px;font-weight:800;fill:#14243c}.cs{font-size:18px;fill:#52657f}</style></defs>
  <rect width="1600" height="800" fill="#fff"/><text x="800" y="82" text-anchor="middle" class="h">VALIDAR ANTES DE INTERPRETAR</text><text x="800" y="117" text-anchor="middle" class="k" fill="#54769f">PARÁMETROS · CALIDAD INTERNA · ESTABILIDAD · CONTEXTO</text>
  <g filter="url(#shadow)"><circle cx="800" cy="392" r="154" fill="#fff" stroke="#d9e3ef" stroke-width="16"/><rect x="145" y="222" width="510" height="335" rx="36" fill="#fff"/><rect x="945" y="222" width="510" height="335" rx="36" fill="#fff"/></g>
  <g stroke-width="4" fill="none"><path d="M646 371h-6" stroke="#f5bd4d"/><path d="M954 371h-6" stroke="#14b8a6"/></g>
  <text x="800" y="365" text-anchor="middle" class="c">SELECCIÓN</text><text x="800" y="399" text-anchor="middle" class="cs">combinar evidencia</text><text x="800" y="429" text-anchor="middle" class="cs">no optimizar una sola cifra</text>
  <circle cx="245" cy="222" r="39" fill="#f5bd4d"/><text x="245" y="231" text-anchor="middle" class="w">1</text><text x="205" y="302" class="t">Método del codo</text><text x="205" y="336" class="p">Buscar la ganancia marginal</text><text x="205" y="362" class="p">al añadir clusters</text><g transform="translate(220 407)"><path d="M0 87H350M0 0V87" stroke="#aabbd0" stroke-width="3"/><path d="M18 12C95 35 147 62 202 71S280 82 338 83" fill="none" stroke="#2563eb" stroke-width="7" stroke-linecap="round"/><circle cx="202" cy="71" r="10" fill="#f5bd4d"/><text x="224" y="58" class="p">K candidato</text></g>
  <circle cx="1045" cy="222" r="39" fill="#14b8a6"/><text x="1045" y="231" text-anchor="middle" class="w">2</text><text x="1005" y="302" class="t">Coeficiente de silueta</text><text x="1005" y="336" class="p">Comparar cohesión y</text><text x="1005" y="362" class="p">separación entre grupos</text><g transform="translate(1030 414)"><circle cx="54" cy="48" r="36" fill="#dbeafe"/><circle cx="54" cy="48" r="9" fill="#2563eb"/><circle cx="176" cy="48" r="36" fill="#ccfbf1"/><circle cx="176" cy="48" r="9" fill="#14b8a6"/><path d="M90 48h50" stroke="#aabbd0" stroke-width="4" stroke-dasharray="7 8"/><rect x="246" y="14" width="154" height="68" rx="20" fill="#142b4b"/><text x="323" y="42" text-anchor="middle" class="w">−1 ≤ s(i) ≤ 1</text><text x="323" y="67" text-anchor="middle" font-family="Arial" font-size="14" fill="#dce8fa">mayor es mejor</text></g>
  <g transform="translate(282 670)"><rect width="1036" height="58" rx="29" fill="#f2f6fb"/><circle cx="39" cy="29" r="10" fill="#f36f45"/><text x="66" y="36" class="p">La solución final debe ser estable, interpretable y útil para el dominio.</text></g>
</svg>
