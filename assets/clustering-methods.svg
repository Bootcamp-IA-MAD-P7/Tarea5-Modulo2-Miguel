<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 860" role="img" aria-labelledby="title desc">
  <title id="title">Cuatro enfoques de clustering</title><desc id="desc">Infografía centrada de centroides, jerarquía, densidad y probabilidad.</desc>
  <defs><filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#18355f" flood-opacity=".13"/></filter><style>text{font-family:Arial,Helvetica,sans-serif}.h{font-size:38px;font-weight:800;fill:#14243c}.k{font-size:16px;font-weight:700;letter-spacing:2.5px}.t{font-size:26px;font-weight:800;fill:#14243c}.p{font-size:18px;fill:#52657f}.w{font-size:21px;font-weight:800;fill:#fff}.c{font-size:26px;font-weight:800;fill:#14243c}.cs{font-size:18px;fill:#52657f}</style></defs>
  <rect width="1600" height="860" fill="#fff"/><text x="800" y="82" text-anchor="middle" class="h">CUATRO FORMAS DE ENTENDER UN CLUSTER</text><text x="800" y="117" text-anchor="middle" class="k" fill="#54769f">EL ENFOQUE DEFINE EL RESULTADO</text>
  <g stroke-width="4" fill="none"><path d="M660 365L450 255" stroke="#8b5cf6"/><path d="M940 365L1150 255" stroke="#13b8a6"/><path d="M660 495L450 605" stroke="#2563eb"/><path d="M940 495L1150 605" stroke="#e95688"/></g>
  <g filter="url(#shadow)"><circle cx="800" cy="430" r="156" fill="#fff" stroke="#d8e1ed" stroke-width="16"/><rect x="132" y="168" width="350" height="170" rx="34" fill="#fff"/><rect x="1118" y="168" width="350" height="170" rx="34" fill="#fff"/><rect x="132" y="522" width="350" height="170" rx="34" fill="#fff"/><rect x="1118" y="522" width="350" height="170" rx="34" fill="#fff"/></g>
  <circle cx="450" cy="168" r="39" fill="#8b5cf6"/><text x="450" y="177" text-anchor="middle" class="w">K</text><text x="178" y="246" class="t">Centroides</text><text x="178" y="281" class="p">Proximidad a una media</text><text x="178" y="309" class="p">Algoritmo: K-Means</text>
  <circle cx="1150" cy="168" r="39" fill="#13b8a6"/><text x="1150" y="178" text-anchor="middle" class="w">↗</text><text x="1164" y="246" class="t">Jerarquía</text><text x="1164" y="281" class="p">Fusiones a distintas escalas</text><text x="1164" y="309" class="p">Algoritmo: Aglomerativo</text>
  <circle cx="450" cy="522" r="39" fill="#2563eb"/><text x="450" y="531" text-anchor="middle" class="w">ε</text><text x="178" y="600" class="t">Densidad</text><text x="178" y="635" class="p">Regiones densas conectadas</text><text x="178" y="663" class="p">Algoritmo: DBSCAN</text>
  <circle cx="1150" cy="522" r="39" fill="#e95688"/><text x="1150" y="531" text-anchor="middle" class="w">p</text><text x="1164" y="600" class="t">Probabilidad</text><text x="1164" y="635" class="p">Componentes que se solapan</text><text x="1164" y="663" class="p">Algoritmo: GMM</text>
  <text x="800" y="412" text-anchor="middle" class="c">CLUSTERING</text><text x="800" y="446" text-anchor="middle" class="cs">datos sin etiquetas</text><text x="800" y="476" text-anchor="middle" class="cs">cuatro perspectivas</text>
  <g transform="translate(340 760)"><rect width="920" height="48" rx="24" fill="#f2f6fb"/><text x="460" y="31" text-anchor="middle" class="p">La mejor elección depende de la geometría, el ruido y el objetivo del análisis.</text></g>
</svg>
