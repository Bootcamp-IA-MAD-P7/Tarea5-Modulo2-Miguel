 <title id="title">Del dato a la estructura</title><desc id="desc">Infografía sobre el flujo del aprendizaje no supervisado.</desc><defs><linearGradient id="shade" x2="1" y2="1"><stop stop-color="#06162d" stop-opacity=".78"/><stop offset="1" stop-color="#102c56" stop-opacity=".55"/></linearGradient><style>text{font-family:Arial,Helvetica,sans-serif}.over{font-size:17px;font-weight:700;letter-spacing:3px}.h{font-size:28px;font-weight:800}.p{font-size:18px}</style></defs>
 <image href="./learning-foundations-v2.png" width="1600" height="900" preserveAspectRatio="xMidYMid slice" opacity=".46"/><rect width="1600" height="900" fill="url(#shade)"/><text x="800" y="72" text-anchor="middle" class="over" fill="#7dd3fc">APRENDIZAJE NO SUPERVISADO · RECORRIDO DE ANÁLISIS</text><text x="800" y="116" text-anchor="middle" class="h" fill="#fff">DEL DATO A LA ESTRUCTURA</text>
 <g fill="#06162d" fill-opacity=".87" stroke="#38bdf8" stroke-width="2"><rect x="76" y="170" width="360" height="108" rx="18"/><rect x="1164" y="170" width="360" height="108" rx="18"/><rect x="76" y="625" width="360" height="108" rx="18"/><rect x="1164" y="625" width="360" height="108" rx="18"/></g><g fill="#fff"><text x="105" y="214" class="h">DATOS SIN ETIQUETA</text><text x="105" y="246" class="p">Observaciones sin una clase objetivo.</text><text x="1193" y="214" class="h">SIMILITUD</text><text x="1193" y="246" class="p">Una métrica decide qué es próximo.</text><text x="105" y="669" class="h">CLUSTERS</text><text x="105" y="701" class="p">Cohesión interna y separación externa.</text><text x="1193" y="669" class="h">INTERPRETACIÓN</text><text x="1193" y="701" class="p">El dominio convierte grupos en valor.</text></g>
 <rect x="570" y="395" width="460" height="102" rx="51" fill="#06162d" fill-opacity=".9" stroke="#38bdf8" stroke-width="2"/><text x="800" y="437" text-anchor="middle" class="over" fill="#7dd3fc">CLUSTERING</text><text x="800" y="469" text-anchor="middle" class="p" fill="#fff">descubrir estructura en los propios datos</text>
