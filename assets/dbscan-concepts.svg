<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 780" role="img" aria-labelledby="title desc">
  <title id="title">Conceptos fundamentales de DBSCAN</title><desc id="desc">Infografía sobre radio epsilon, puntos núcleo, frontera y ruido.</desc>
  <defs><filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#18355f" flood-opacity=".13"/></filter><style>text{font-family:Arial,Helvetica,sans-serif}.h{font-size:38px;font-weight:800;fill:#14243c}.k{font-size:16px;font-weight:700;letter-spacing:2.5px}.t{font-size:26px;font-weight:800;fill:#14243c}.p{font-size:18px;fill:#52657f}.w{font-size:21px;font-weight:800;fill:#fff}.c{font-size:25px;font-weight:800;fill:#14243c}.cs{font-size:18px;fill:#52657f}</style></defs>
  <rect width="1600" height="780" fill="#fff"/><text x="800" y="82" text-anchor="middle" class="h">DBSCAN · DENSIDAD, CONECTIVIDAD Y RUIDO</text><text x="800" y="117" text-anchor="middle" class="k" fill="#54769f">ε DEFINE EL RADIO · MINPTS DEFINE LA DENSIDAD</text>
  <g filter="url(#shadow)"><circle cx="800" cy="330" r="152" fill="#fff" stroke="#d9e3ef" stroke-width="16"/><rect x="150" y="494" width="360" height="170" rx="34" fill="#fff"/><rect x="620" y="494" width="360" height="170" rx="34" fill="#fff"/><rect x="1090" y="494" width="360" height="170" rx="34" fill="#fff"/></g>
  <g stroke-width="4" fill="none"><path d="M714 456L390 494" stroke="#4f46e5"/><path d="M800 482v12" stroke="#14b8a6"/><path d="M886 456L1210 494" stroke="#94a3b8"/></g>
  <circle cx="800" cy="330" r="92" fill="#f4f8fd" stroke="#2563eb" stroke-width="4" stroke-dasharray="9 9"/><g fill="#7fb2fb"><circle cx="754" cy="292" r="8"/><circle cx="788" cy="272" r="8"/><circle cx="832" cy="296" r="8"/><circle cx="848" cy="343" r="8"/><circle cx="811" cy="371" r="8"/><circle cx="764" cy="357" r="8"/></g><circle cx="800" cy="330" r="13" fill="#f5bd4d"/><text x="800" y="432" text-anchor="middle" class="c">VECINDARIO ε</text>
  <circle cx="330" cy="494" r="39" fill="#4f46e5"/><text x="330" y="503" text-anchor="middle" class="w">N</text><text x="196" y="578" class="t">Punto núcleo</text><text x="196" y="613" class="p">≥ MinPts vecinos</text><text x="196" y="641" class="p">expande el cluster</text>
  <circle cx="800" cy="494" r="39" fill="#14b8a6"/><text x="800" y="503" text-anchor="middle" class="w">F</text><text x="666" y="578" class="t">Punto frontera</text><text x="666" y="613" class="p">cerca de un núcleo</text><text x="666" y="641" class="p">se asigna al cluster</text>
  <circle cx="1270" cy="494" r="39" fill="#94a3b8"/><text x="1270" y="503" text-anchor="middle" class="w">−1</text><text x="1136" y="578" class="t">Ruido</text><text x="1136" y="613" class="p">sin conexión densa</text><text x="1136" y="641" class="p">no se fuerza a un grupo</text>
  <text x="800" y="728" text-anchor="middle" class="p">Los clusters aparecen cuando los puntos núcleo forman una cadena conectada por densidad.</text>
