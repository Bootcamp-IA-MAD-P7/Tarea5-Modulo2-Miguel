<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">Conceptos fundamentales de DBSCAN</title><desc id="desc">Infografía sobre puntos núcleo, frontera y ruido en clustering basado en densidad.</desc>
  <defs><filter id="s"><feDropShadow dx="0" dy="9" stdDeviation="9" flood-color="#17335b" flood-opacity=".14"/></filter><style>text{font-family:Arial,Helvetica,sans-serif}.h{font-size:28px;font-weight:800;fill:#132b4b}.k{font-size:14px;font-weight:700;letter-spacing:2px}.t{font-size:23px;font-weight:800;fill:#132b4b}.p{font-size:16px;fill:#5a6b81}.w{font-size:20px;font-weight:800;fill:#fff}</style></defs>
  <rect width="1600" height="520" rx="28" fill="#f7f9fd"/><text x="70" y="71" class="h">DBSCAN · DENSIDAD, CONECTIVIDAD Y RUIDO</text><text x="70" y="102" class="k" fill="#5d779c">DOS HIPERPARÁMETROS: ε Y MINPTS</text>
  <g filter="url(#s)"><rect x="70" y="150" width="460" height="286" rx="32" fill="#132b4b"/><rect x="574" y="150" width="286" height="286" rx="32" fill="#fff"/><rect x="898" y="150" width="286" height="286" rx="32" fill="#fff"/><rect x="1222" y="150" width="308" height="286" rx="32" fill="#fff"/></g>
  <g transform="translate(112 191)"><circle cx="125" cy="105" r="76" fill="none" stroke="#83b8ff" stroke-width="3" stroke-dasharray="7 8"/><g fill="#8dc1ff"><circle cx="62" cy="80" r="8"/><circle cx="92" cy="53" r="8"/><circle cx="126" cy="80" r="8"/><circle cx="158" cy="57" r="8"/><circle cx="184" cy="100" r="8"/><circle cx="147" cy="130" r="8"/><circle cx="93" cy="139" r="8"/></g><circle cx="125" cy="105" r="11" fill="#f6c85f"/><text x="125" y="220" text-anchor="middle" class="w">ε · VECINDARIO LOCAL</text></g>
  <g><circle cx="617" cy="207" r="32" fill="#4f46e5"/><text x="617" y="216" text-anchor="middle" class="w">N</text><text x="617" y="285" class="t">Punto núcleo</text><text x="617" y="317" class="p">≥ MinPts vecinos</text><text x="617" y="344" class="p">expande el cluster</text></g>
  <g><circle cx="941" cy="207" r="32" fill="#14b8a6"/><text x="941" y="216" text-anchor="middle" class="w">F</text><text x="941" y="285" class="t">Punto frontera</text><text x="941" y="317" class="p">cerca de un núcleo</text><text x="941" y="344" class="p">se asigna al cluster</text></g>
  <g><circle cx="1265" cy="207" r="32" fill="#94a3b8"/><text x="1265" y="216" text-anchor="middle" class="w">−1</text><text x="1265" y="285" class="t">Ruido</text><text x="1265" y="317" class="p">sin conexión densa</text><text x="1265" y="344" class="p">no se fuerza a un grupo</text></g>
