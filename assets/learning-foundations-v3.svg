<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
 <title id="title">Del dato sin etiqueta a una estructura interpretable</title><desc id="desc">Infografía con cuatro etapas del clustering: datos, similitud, agrupamiento e interpretación.</desc>
 <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c0d0b"/><stop offset=".58" stop-color="#211805"/><stop offset="1" stop-color="#493208"/></linearGradient><radialGradient id="g" cx="75%" cy="47%" r="60%"><stop stop-color="#e6a72e" stop-opacity=".28"/><stop offset="1" stop-color="#e6a72e" stop-opacity="0"/></radialGradient><filter id="s"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000" flood-opacity=".42"/></filter><style>text{font-family:Arial,Helvetica,sans-serif}.over{font-size:18px;font-weight:700;letter-spacing:4px}.h{font-size:31px;font-weight:800}.p{font-size:20px}.n{font-size:21px;font-weight:800}.center{font-size:17px;font-weight:700;letter-spacing:2px}</style></defs>
 <rect width="1600" height="900" fill="url(#bg)"/><rect width="1600" height="900" fill="url(#g)"/><text x="800" y="77" text-anchor="middle" class="over" fill="#f8c65a">APRENDIZAJE NO SUPERVISADO · RECORRIDO DE ANÁLISIS</text><text x="800" y="124" text-anchor="middle" class="h" fill="#fff">DEL DATO A LA ESTRUCTURA</text>
 <g stroke="#d1a347" stroke-width="3" fill="none"><path d="M665 383H520L451 283"/><path d="M935 383H1080L1149 283"/><path d="M665 517H520L451 617"/><path d="M935 517H1080L1149 617"/></g><g fill="#f8c65a"><circle cx="665" cy="383" r="7"/><circle cx="935" cy="383" r="7"/><circle cx="665" cy="517" r="7"/><circle cx="935" cy="517" r="7"/></g>
 <g filter="url(#s)"><circle cx="800" cy="450" r="155" fill="#15140f" stroke="#f8c65a" stroke-width="6"/><circle cx="800" cy="450" r="128" fill="none" stroke="#d1a347" stroke-width="2" stroke-dasharray="6 10"/></g><g fill="#f8c65a"><circle cx="753" cy="415" r="8"/><circle cx="785" cy="395" r="8"/><circle cx="816" cy="416" r="8"/><circle cx="847" cy="400" r="8"/><circle cx="770" cy="452" r="8"/><circle cx="805" cy="456" r="8"/><circle cx="836" cy="449" r="8"/><circle cx="786" cy="488" r="8"/><circle cx="821" cy="491" r="8"/></g><text x="800" y="523" text-anchor="middle" class="center" fill="#f8c65a">CLUSTERING</text><text x="800" y="552" text-anchor="middle" class="p" fill="#fff">estructura propuesta</text>
 <g transform="translate(92 177)" filter="url(#s)"><rect width="420" height="195" rx="30" fill="#f7f1e5"/><rect width="10" height="195" rx="5" fill="#f8c65a"/><circle cx="59" cy="-2" r="32" fill="#f8c65a"/><text x="59" y="7" text-anchor="middle" class="n" fill="#102c56">01</text><text x="50" y="72" class="h" fill="#102c56">DATOS</text><text x="50" y="108" class="p" fill="#342705">Observaciones con variables,</text><text x="50" y="135" class="p" fill="#342705">pero sin etiqueta objetivo.</text><g fill="#d89d20"><circle cx="326" cy="85" r="9"/><circle cx="363" cy="70" r="9"/><circle cx="390" cy="103" r="9"/><circle cx="346" cy="120" r="9"/></g></g>
 <g transform="translate(1088 177)" filter="url(#s)"><rect width="420" height="195" rx="30" fill="#f7f1e5"/><rect x="410" width="10" height="195" rx="5" fill="#f8c65a"/><circle cx="361" cy="-2" r="32" fill="#f8c65a"/><text x="361" y="7" text-anchor="middle" class="n" fill="#102c56">02</text><text x="50" y="72" class="h" fill="#102c56">SIMILITUD</text><text x="50" y="108" class="p" fill="#342705">Una métrica define qué</text><text x="50" y="135" class="p" fill="#342705">puntos se consideran próximos.</text><path d="M320 104h78" stroke="#102c56" stroke-width="3" stroke-dasharray="5 5"/><circle cx="320" cy="104" r="9" fill="#d89d20"/><circle cx="398" cy="104" r="9" fill="#d89d20"/></g>
 <g transform="translate(92 528)" filter="url(#s)"><rect width="420" height="195" rx="30" fill="#f7f1e5"/><rect width="10" height="195" rx="5" fill="#f8c65a"/><circle cx="59" cy="-2" r="32" fill="#f8c65a"/><text x="59" y="7" text-anchor="middle" class="n" fill="#102c56">03</text><text x="50" y="72" class="h" fill="#102c56">GRUPOS</text><text x="50" y="108" class="p" fill="#342705">Cohesión dentro de cada</text><text x="50" y="135" class="p" fill="#342705">cluster y separación entre ellos.</text><g fill="#102c56"><circle cx="328" cy="95" r="8"/><circle cx="355" cy="79" r="8"/><circle cx="365" cy="111" r="8"/></g><g fill="#d89d20"><circle cx="397" cy="92" r="8"/><circle cx="416" cy="114" r="8"/></g></g>
 <g transform="translate(1088 528)" filter="url(#s)"><rect width="420" height="195" rx="30" fill="#f7f1e5"/><rect x="410" width="10" height="195" rx="5" fill="#f8c65a"/><circle cx="361" cy="-2" r="32" fill="#f8c65a"/><text x="361" y="7" text-anchor="middle" class="n" fill="#102c56">04</text><text x="50" y="72" class="h" fill="#102c56">INTERPRETAR</text><text x="50" y="108" class="p" fill="#342705">El dominio da significado</text><text x="50" y="135" class="p" fill="#342705">y utilidad a los grupos.</text><path d="M341 78l47 25v42l-47 25-47-25v-42z" fill="none" stroke="#d89d20" stroke-width="4"/><circle cx="341" cy="124" r="11" fill="#102c56"/></g>
 <text x="800" y="842" text-anchor="middle" class="over" fill="#f8c65a">EL ALGORITMO PROPONE PATRONES; EL CONTEXTO DECIDE SI SON ÚTILES</text>
</svg>
