<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
 <title id="title">Validación de agrupamientos</title><desc id="desc">Infografía sobre el método del codo y la silueta.</desc><defs><linearGradient id="shade" x2="1" y2="1"><stop stop-color="#06162d" stop-opacity=".78"/><stop offset="1" stop-color="#102c56" stop-opacity=".55"/></linearGradient><style>text{font-family:Arial,Helvetica,sans-serif}.over{font-size:17px;font-weight:700;letter-spacing:3px}.h{font-size:28px;font-weight:800}.p{font-size:18px}.tag{font-size:14px;font-weight:700;letter-spacing:1.2px}</style></defs>
 <image href="./validation-guide-v2.png" width="1600" height="900" preserveAspectRatio="xMidYMid slice" opacity=".45"/><rect width="1600" height="900" fill="url(#shade)"/><text x="800" y="72" text-anchor="middle" class="over" fill="#7dd3fc">HIPERPARÁMETROS · CALIDAD INTERNA · CONTEXTO</text><text x="800" y="116" text-anchor="middle" class="h" fill="#fff">VALIDAR ANTES DE INTERPRETAR</text>
 <g fill="#06162d" fill-opacity=".88" stroke="#38bdf8" stroke-width="2"><rect x="110" y="180" width="395" height="130" rx="18"/><rect x="1095" y="180" width="395" height="130" rx="18"/></g><g fill="#fff"><text x="140" y="225" class="h">MÉTODO DEL CODO</text><text x="140" y="256" class="p">Busca la ganancia marginal al añadir K.</text><text x="140" y="284" class="tag" fill="#7dd3fc">INERCIA · K CANDIDATO</text><text x="1125" y="225" class="h">COEFICIENTE DE SILUETA</text><text x="1125" y="256" class="p">Cohesión interna frente a separación.</text><text x="1125" y="284" class="tag" fill="#7dd3fc">−1 ≤ s(i) ≤ 1 · MAYOR ES MEJOR</text></g>
 <rect x="500" y="650" width="600" height="80" rx="40" fill="#06162d" fill-opacity=".9" stroke="#38bdf8" stroke-width="2"/><text x="800" y="699" text-anchor="middle" class="p" fill="#fff">La solución debe ser estable, interpretable y útil.</text>
