<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">Mapa visual de algoritmos de clustering</title>
  <desc id="description">Infografía oscura en tonos dorados con cuatro enfoques de clustering alrededor de un núcleo central.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c0d0b"/><stop offset=".55" stop-color="#201805"/><stop offset="1" stop-color="#3a2705"/></linearGradient>
    <radialGradient id="amberGlow" cx="78%" cy="46%" r="60%"><stop stop-color="#e6a72e" stop-opacity=".28"/><stop offset="1" stop-color="#e6a72e" stop-opacity="0"/></radialGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000" flood-opacity=".44"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="7"/></filter>
    <style>
      text{font-family:Arial,Helvetica,sans-serif}.eyebrow{font-size:18px;font-weight:700;letter-spacing:4px}.heading{font-size:30px;font-weight:800;letter-spacing:1px}.copy{font-size:20px;font-weight:400}.micro{font-size:17px;font-weight:700;letter-spacing:2px}.number{font-size:22px;font-weight:800}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#background)"/><rect width="1600" height="900" fill="url(#amberGlow)"/>
  <g opacity=".2" stroke="#d1a347" stroke-width="1"><path d="M0 122H1600M0 775H1600M164 0V900M1436 0V900"/><circle cx="800" cy="450" r="260" fill="none"/><circle cx="800" cy="450" r="330" fill="none" stroke-dasharray="4 11"/></g>
  <text x="800" y="78" text-anchor="middle" class="eyebrow" fill="#f8c65a">MAPA COMPARATIVO · CUATRO FORMAS DE ENCONTRAR ESTRUCTURA</text>
  <text x="800" y="122" text-anchor="middle" class="heading" fill="#fff">ENFOQUES DE CLUSTERING</text>

  <g stroke="#d1a347" stroke-width="3" fill="none" opacity=".95"><path d="M680 365H540L474 274"/><path d="M920 365H1060L1126 274"/><path d="M680 535H540L474 626"/><path d="M920 535H1060L1126 626"/></g>
  <g fill="#f8c65a"><circle cx="680" cy="365" r="7"/><circle cx="920" cy="365" r="7"/><circle cx="680" cy="535" r="7"/><circle cx="920" cy="535" r="7"/></g>

  <g filter="url(#shadow)"><circle cx="800" cy="450" r="154" fill="#15140f" stroke="#f8c65a" stroke-width="6"/><circle cx="800" cy="450" r="132" fill="none" stroke="#d1a347" stroke-width="2" stroke-dasharray="5 9"/></g>
  <g fill="#f8c65a"><circle cx="770" cy="421" r="8"/><circle cx="800" cy="401" r="8"/><circle cx="830" cy="421" r="8"/><circle cx="750" cy="453" r="8"/><circle cx="780" cy="465" r="8"/><circle cx="815" cy="452" r="8"/><circle cx="845" cy="467" r="8"/><circle cx="800" cy="490" r="8"/></g>
  <text x="800" y="523" text-anchor="middle" class="eyebrow" fill="#f8c65a">DATOS SIN ETIQUETA</text>
  <text x="800" y="553" text-anchor="middle" class="copy" fill="#fff">patrones · proximidad · densidad</text>

  <g transform="translate(92 170)" filter="url(#shadow)"><rect width="420" height="202" rx="30" fill="#f7f1e5"/><rect width="10" height="202" rx="5" fill="#f8c65a"/><circle cx="59" cy="-2" r="32" fill="#f8c65a"/><text x="59" y="6" text-anchor="middle" class="number" fill="#102c56">01</text><text x="50" y="72" class="heading" fill="#102c56">K-MEANS</text><text x="50" y="108" class="copy" fill="#342705">Partición alrededor de</text><text x="50" y="135" class="copy" fill="#342705">centroides representativos.</text><g transform="translate(326 76)" fill="#d89d20"><circle cx="0" cy="0" r="8"/><circle cx="38" cy="-20" r="8"/><circle cx="38" cy="20" r="8"/><circle cx="74" cy="0" r="8"/></g><path d="M336 76L374 56M336 76L374 96M374 56L410 76M374 96L410 76" stroke="#102c56" stroke-width="3"/></g>
  <g transform="translate(1088 170)" filter="url(#shadow)"><rect width="420" height="202" rx="30" fill="#f7f1e5"/><rect x="410" width="10" height="202" rx="5" fill="#f8c65a"/><circle cx="361" cy="-2" r="32" fill="#f8c65a"/><text x="361" y="6" text-anchor="middle" class="number" fill="#102c56">02</text><text x="52" y="72" class="heading" fill="#102c56">JERÁRQUICO</text><text x="52" y="108" class="copy" fill="#342705">Fusiones sucesivas que</text><text x="52" y="135" class="copy" fill="#342705">conservan una estructura.</text><g stroke="#102c56" stroke-width="4" fill="none"><path d="M330 74V98M300 98H360M300 98V121M360 98V121M282 121H318M342 121H378"/></g></g>
  <g transform="translate(92 528)" filter="url(#shadow)"><rect width="420" height="202" rx="30" fill="#f7f1e5"/><rect width="10" height="202" rx="5" fill="#f8c65a"/><circle cx="59" cy="-2" r="32" fill="#f8c65a"/><text x="59" y="6" text-anchor="middle" class="number" fill="#102c56">03</text><text x="50" y="72" class="heading" fill="#102c56">DBSCAN</text><text x="50" y="108" class="copy" fill="#342705">Regiones densas conectadas</text><text x="50" y="135" class="copy" fill="#342705">y detección de ruido.</text><path d="M335 65c55-20 91 25 68 79-22 42-102 35-101-24 0-28 10-45 33-55z" fill="none" stroke="#d89d20" stroke-width="3" stroke-dasharray="6 6"/><g fill="#102c56"><circle cx="333" cy="97" r="7"/><circle cx="360" cy="86" r="7"/><circle cx="379" cy="113" r="7"/><circle cx="348" cy="124" r="7"/><circle cx="397" cy="92" r="7"/></g><circle cx="292" cy="145" r="6" fill="#d89d20"/></g>
  <g transform="translate(1088 528)" filter="url(#shadow)"><rect width="420" height="202" rx="30" fill="#f7f1e5"/><rect x="410" width="10" height="202" rx="5" fill="#f8c65a"/><circle cx="361" cy="-2" r="32" fill="#f8c65a"/><text x="361" y="6" text-anchor="middle" class="number" fill="#102c56">04</text><text x="52" y="72" class="heading" fill="#102c56">GMM</text><text x="52" y="108" class="copy" fill="#342705">Componentes probabilísticos</text><text x="52" y="135" class="copy" fill="#342705">con posible solapamiento.</text><g fill="none" stroke-width="4"><ellipse cx="333" cy="93" rx="42" ry="22" stroke="#d89d20" transform="rotate(-30 333 93)"/><ellipse cx="374" cy="110" rx="42" ry="22" stroke="#102c56" transform="rotate(30 374 110)"/><ellipse cx="355" cy="137" rx="42" ry="22" stroke="#9b6517" transform="rotate(-12 355 137)"/></g></g>
  <text x="800" y="842" text-anchor="middle" class="micro" fill="#f8c65a">LA ELECCIÓN DEPENDE DE LA GEOMETRÍA, EL RUIDO Y EL OBJETIVO DEL ANÁLISIS</text>
</svg>
