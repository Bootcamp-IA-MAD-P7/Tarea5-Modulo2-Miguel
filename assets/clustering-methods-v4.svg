<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
 <title id="title">Enfoques de clustering</title><desc id="desc">Infografía comparativa con K-Means, clustering jerárquico, DBSCAN y GMM.</desc><defs><linearGradient id="shade" x2="1" y2="1"><stop stop-color="#06162d" stop-opacity=".78"/><stop offset="1" stop-color="#102c56" stop-opacity=".56"/></linearGradient><style>text{font-family:Arial,Helvetica,sans-serif}.over{font-size:17px;font-weight:700;letter-spacing:3px}.h{font-size:28px;font-weight:800}.p{font-size:18px}.tag{font-size:14px;font-weight:700;letter-spacing:1.5px}</style></defs>
 <image href="./clustering-methods-v2.png" width="1600" height="900" preserveAspectRatio="xMidYMid slice" opacity=".46"/><rect width="1600" height="900" fill="url(#shade)"/><text x="800" y="72" text-anchor="middle" class="over" fill="#7dd3fc">MAPA COMPARATIVO · APRENDIZAJE NO SUPERVISADO</text><text x="800" y="116" text-anchor="middle" class="h" fill="#fff">ENFOQUES DE CLUSTERING</text>
 <g fill="#06162d" fill-opacity=".86" stroke="#38bdf8" stroke-width="2"><rect x="85" y="170" width="350" height="125" rx="18"/><rect x="1165" y="170" width="350" height="125" rx="18"/><rect x="85" y="605" width="350" height="125" rx="18"/><rect x="1165" y="605" width="350" height="125" rx="18"/></g>
 <g fill="#fff"><text x="115" y="215" class="h">K-MEANS</text><text x="115" y="246" class="p">Partición alrededor de centroides.</text><text x="115" y="274" class="tag" fill="#7dd3fc">K FIJADO · GRUPOS COMPACTOS</text><text x="1195" y="215" class="h">JERÁRQUICO</text><text x="1195" y="246" class="p">Fusiones sucesivas en un árbol.</text><text x="1195" y="274" class="tag" fill="#7dd3fc">DENDROGRAMA · ENLACE</text><text x="115" y="650" class="h">DBSCAN</text><text x="115" y="681" class="p">Regiones densas y ruido explícito.</text><text x="115" y="709" class="tag" fill="#7dd3fc">ε · MinPts · FORMAS IRREGULARES</text><text x="1195" y="650" class="h">GMM</text><text x="1195" y="681" class="p">Componentes probabilísticos solapables.</text><text x="1195" y="709" class="tag" fill="#7dd3fc">ASIGNACIÓN SUAVE · PROBABILIDAD</text></g>
