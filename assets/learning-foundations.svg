<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 860" role="img" aria-labelledby="title desc">
  <title id="title">Del dato a la estructura</title><desc id="desc">Infografía centrada sobre aprendizaje no supervisado y clustering.</desc>
  <defs><filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#18355f" flood-opacity=".13"/></filter><style>text{font-family:Arial,Helvetica,sans-serif}.h{font-size:38px;font-weight:800;fill:#14243c}.k{font-size:16px;font-weight:700;letter-spacing:2.5px}.t{font-size:25px;font-weight:800;fill:#14243c}.p{font-size:18px;fill:#52657f}.w{font-size:22px;font-weight:800;fill:#fff}.s{font-size:16px;fill:#9db9df}</style></defs>
  <rect width="1600" height="860" fill="#ffffff"/>
  <text x="800" y="82" text-anchor="middle" class="h">DEL DATO A LA ESTRUCTURA</text><text x="800" y="117" text-anchor="middle" class="k" fill="#54769f">APRENDIZAJE NO SUPERVISADO</text>
  <g stroke="#c8d6e8" stroke-width="4" fill="none"><path d="M620 390L410 265M620 470L410 595M980 390L1190 265M980 470L1190 595"/></g>
  <g filter="url(#shadow)"><circle cx="800" cy="430" r="180" fill="#142b4b"/><circle cx="800" cy="430" r="140" fill="#1e4777" stroke="#f5bd4d" stroke-width="10"/><rect x="145" y="170" width="310" height="190" rx="34" fill="#fff"/><rect x="145" y="500" width="310" height="190" rx="34" fill="#fff"/><rect x="1145" y="170" width="310" height="190" rx="34" fill="#fff"/><rect x="1145" y="500" width="310" height="190" rx="34" fill="#fff"/></g>
  <g><circle cx="300" cy="170" r="38" fill="#f5bd4d"/><text x="300" y="179" text-anchor="middle" class="w">01</text><text x="190" y="249" class="t">Datos</text><text x="190" y="282" class="p">Observaciones sin</text><text x="190" y="308" class="p">respuesta conocida</text></g>
  <g><circle cx="300" cy="500" r="38" fill="#8b5cf6"/><text x="300" y="509" text-anchor="middle" class="w">02</text><text x="190" y="579" class="t">Similitud</text><text x="190" y="612" class="p">Distancia, métrica</text><text x="190" y="638" class="p">o representación</text></g>
  <g><circle cx="1300" cy="170" r="38" fill="#13b8a6"/><text x="1300" y="179" text-anchor="middle" class="w">03</text><text x="1190" y="249" class="t">Algoritmo</text><text x="1190" y="282" class="p">Busca patrones</text><text x="1190" y="308" class="p">y regularidades</text></g>
  <g><circle cx="1300" cy="500" r="38" fill="#f36f45"/><text x="1300" y="509" text-anchor="middle" class="w">04</text><text x="1190" y="579" class="t">Interpretación</text><text x="1190" y="612" class="p">Validar y convertir</text><text x="1190" y="638" class="p">grupos en decisiones</text></g>
  <text x="800" y="395" text-anchor="middle" class="w">CLUSTERING</text><text x="800" y="430" text-anchor="middle" class="s">descubrir estructura</text><text x="800" y="458" text-anchor="middle" class="s">sin etiquetas</text>
  <g transform="translate(330 754)"><rect width="940" height="56" rx="28" fill="#f2f6fb"/><circle cx="38" cy="28" r="10" fill="#2563eb"/><text x="65" y="35" class="p">Supervisado: X + y → predicción</text><circle cx="495" cy="28" r="10" fill="#f5bd4d"/><text x="522" y="35" class="p">No supervisado: X → estructura latente</text></g>
</svg>
